[package]
name = "solstrap"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solstrap-core = { path = "../../crates/core" }
