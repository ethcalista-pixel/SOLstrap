name: Check Windows alpha
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p solstrap-core -p solstrap-launcher --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p solstrap-launcher -p solstrap --release --locked
