[package]
name = "solstrap-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
roxmltree = "0.21"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_EventLog", "Win32_System_Diagnostics_ToolHelp"] }
